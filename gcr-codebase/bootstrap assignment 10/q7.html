<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Tracker</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="q7.css">
</head>
<body class="bg-body-tertiary">
<header class="bg-dark text-white py-3">
  <div class="container d-flex justify-content-between align-items-center">

    <span class="fs-6">Pending <span class="badge rounded-pill text-bg-warning">4</span></span>

</header>
<main class="container py-4 wrap">
  <ul class="list-group shadow-sm">
    <li class="list-group-item d-flex justify-content-between align-items-center">Fix login redirect bug <span class="badge text-bg-danger">High</span></li>
    <li class="list-group-item d-flex justify-content-between align-items-center">Write API documentation <span class="badge text-bg-warning">Medium</span></li>
    <li class="list-group-item d-flex justify-content-between align-items-center">Review pull request #42 <span class="badge text-bg-warning">Medium</span></li>
    <li class="list-group-item d-flex justify-content-between align-items-center">Update footer links <span class="badge text-bg-success">Low</span></li>
  </ul>
  <button type="button" class="btn btn-success mt-3">Completed <span class="badge text-bg-light">12</span></button>
</main>
</body>
</html>
