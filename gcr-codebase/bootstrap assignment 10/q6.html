<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notifications</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="q6.css">
</head>
<body class="bg-body-tertiary">
<header class="py-4 text-center"><h1 class="h3 fw-bold mb-0">Notifications</h1></header>
<main class="container pb-5">
  <div class="card mx-auto panel shadow-sm">
    <div class="card-header fw-semibold">Recent activity</div>
    <div class="card-body">
      <div class="alert alert-success" role="alert"><strong>New message:</strong> Riya replied to your project comment.</div>
      <div class="alert alert-info" role="alert"><strong>Tip:</strong> Press "/" to search from any page.</div>
      <div class="alert alert-danger" role="alert"><strong>Warning:</strong> Your password expires in 2 days.</div>
      <div class="alert alert-warning alert-dismissible fade show" role="alert">
        Scheduled maintenance tonight at 11 pm.
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
      <div class="bg-light border rounded p-3 mt-4">
        <h2 class="h6 mb-1">Summary</h2>
        <p class="mb-0 small">1 new message, 1 tip, 2 warnings today.</p>
      </div>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
