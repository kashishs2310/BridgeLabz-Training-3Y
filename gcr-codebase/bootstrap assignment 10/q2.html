<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kashish Singh - Portfolio</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="q2.css">
</head>
<body class="bg-light text-dark">
<header class="bg-dark text-white p-5 text-center">
  <h1 class="fw-bold display-5">Kashish Singh</h1>
  <p class="lead mb-0">Aspiring security analyst building safer web apps</p>
</header>
<main class="container text-center">
  <section class="mt-4 mb-3">
    <img src="https://picsum.photos/seed/kashish/240/240" class="img-fluid rounded-circle profile-img mb-3" alt="Kashish Singh">
    <p class="mx-auto about">Third-year B.Tech CS student who enjoys network security and secure application development. Looking for internships in security analysis and penetration testing.</p>
    <div class="mt-3">
      <a href="#contact" class="btn btn-primary me-2">Hire Me</a>
      <a href="#" class="btn btn-outline-dark">Download CV</a>
    </div>
  </section>
  <section id="contact" class="p-5 mt-4 mb-3 bg-white rounded-3 shadow-sm mx-auto contact-box">
    <h2 class="fw-bold mb-4">Contact me</h2>
    <form class="text-start">
      <div class="mb-3"><label for="name" class="form-label">Name</label><input type="text" id="name" class="form-control" placeholder="Your name"></div>
      <div class="mb-3"><label for="email" class="form-label">Email</label><input type="email" id="email" class="form-control" placeholder="you@example.com"></div>
      <div class="mb-3"><label for="msg" class="form-label">Message</label><textarea id="msg" class="form-control" rows="3"></textarea></div>
      <button type="submit" class="btn btn-dark w-100">Send message</button>
    </form>
  </section>
</main>
<footer class="text-center text-muted py-4"><small>&copy; 2026 Kashish Singh</small></footer>
</body>
</html>
