<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Borders and Padding Demo</title>
<link rel="stylesheet" href="q1.css">
</head>
<body>

  <header>
    <h1>Borders &amp; Padding Demonstration</h1>
  </header>

  <main class="box-row">
    <section class="box solid-border">
      <p>Solid border, small padding (0.5rem)</p>
    </section>
    <section class="box dashed-border">
      <p>Dashed border, medium padding (1.5rem)</p>
    </section>
    <section class="box double-border">
      <p>Double border, large padding (2.5rem)</p>
    </section>
    <section class="box groove-border">
      <p>Groove border with rounded corners</p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 CSS Practice</p>
  </footer>

</body>
</html>
