<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shadows &amp; Depth</title>
<link rel="stylesheet" href="q4.css">
</head>
<body>

  <header>
    <h1>Shadows &amp; Depth Effects</h1>
  </header>

  <main class="card-row">
    <article class="card shadow-soft">
      <h2>Soft Shadow</h2>
      <p>A light, diffused shadow for a subtle sense of elevation.</p>
    </article>
    <article class="card shadow-hard">
      <h2>Hard Shadow</h2>
      <p>A sharp offset shadow with no blur, for a bold, flat effect.</p>
    </article>
    <article class="card shadow-colored">
      <h2>Colored Shadow</h2>
      <p>A tinted shadow that matches the card's accent color.</p>
    </article>
  </main>

</body>
</html>
