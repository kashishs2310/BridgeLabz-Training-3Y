<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Height &amp; Width Practice</title>
<link rel="stylesheet" href="q2.css">
</head>
<body>

  <header>
    <h1>Height &amp; Width Units Practice</h1>
  </header>

  <main class="stage">
    <div class="box px-box">
      <p>width: 250px<br>height: 150px</p>
    </div>
    <div class="box percent-box">
      <p>width: 40%<br>min-height: 40vh</p>
    </div>
    <div class="box em-box">
      <p>width: 20em<br>max-width: 300px<br>overflow: auto</p>
      <p>Extra text to demonstrate overflow scrolling once the box's
        max-width and height are reached by longer content.</p>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 CSS Practice</p>
  </footer>

</body>
</html>
