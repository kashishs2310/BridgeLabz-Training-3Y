<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transformations Showcase</title>
<link rel="stylesheet" href="q6.css">
</head>
<body>

  <header>
    <h1>CSS Transformations Showcase</h1>
    <p>Hover over each box to see its transformation.</p>
  </header>

  <main class="transform-row">
    <div class="transform-item">
      <div class="box rotate-box"></div>
      <p class="label">rotate()</p>
    </div>
    <div class="transform-item">
      <div class="box scale-box"></div>
      <p class="label">scale()</p>
    </div>
    <div class="transform-item">
      <div class="box translate-box"></div>
      <p class="label">translate()</p>
    </div>
    <div class="transform-item">
      <div class="box skew-box"></div>
      <p class="label">skew()</p>
    </div>
  </main>

</body>
</html>
