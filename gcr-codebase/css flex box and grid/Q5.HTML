<!DOCTYPE html>
<html lang="en">

<title>Pricing</title>
<link rel="stylesheet" href="q5.css">
</head>
<body>

  <section class="pricing">
    <div class="plan">
      <h2>Basic</h2>
      <p class="price">$9<span>/mo</span></p>
      <ul>
        <li>5 projects</li>
        <li>Email support</li>
        <li>1 GB storage</li>
      </ul>
    </div>

    <div class="plan featured">
      <h2>Pro</h2>
      <p class="price">$29<span>/mo</span></p>
      <ul>
        <li>Unlimited projects</li>
        <li>Priority support</li>
        <li>50 GB storage</li>
      </ul>
    </div>

    <div class="plan">
      <h2>Enterprise</h2>
      <p class="price">$79<span>/mo</span></p>
      <ul>
        <li>Unlimited everything</li>
        <li>Dedicated support</li>
        <li>500 GB storage</li>
      </ul>
    </div>
  </section>

</body>
</html>
