<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Gallery</title>
<link rel="stylesheet" href="q8.css">
</head>
<body>

  <main class="gallery">
    <figure class="photo">
      <div class="img mountains"></div>
      <figcaption>Mountains at dawn</figcaption>
    </figure>
    <figure class="photo">
      <div class="img forest"></div>
      <figcaption>Forest trail</figcaption>
    </figure>
    <figure class="photo">
      <div class="img coast"></div>
      <figcaption>Coastal cliffs</figcaption>
    </figure>
    <figure class="photo">
      <div class="img desert"></div>
      <figcaption>Desert dunes</figcaption>
    </figure>
    <figure class="photo">
      <div class="img lake"></div>
      <figcaption>Alpine lake</figcaption>
    </figure>
    <figure class="photo">
      <div class="img city"></div>
      <figcaption>City skyline</figcaption>
    </figure>
  </main>

</body>
</html>
