    body { font-family: Arial, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; }
    #searchBox { width: 100%; padding: 8px; box-sizing: border-box; margin-bottom: 12px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #f0f0f0; }
    #noResults { display: none; text-align: center; color: red; font-weight: bold; }
