<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Q7 - Mouse Coordinates Logger</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; }
    #box { position: relative; width: 400px; height: 400px; box-sizing: border-box;
           border: 2px solid #333; background: #f5f5f5; cursor: crosshair; overflow: hidden; }
    .dot { position: absolute; width: 12px; height: 12px; background: red; border-radius: 50%;
           transform: translate(-50%, -50%); pointer-events: none; }
    #coords { margin-top: 12px; font-weight: bold; }
  </style>
</head>
<body>
  <h2>Mouse Path &amp; Coordinates Logger</h2>
  <div id="box"></div>
  <p id="coords">Move the mouse inside the box</p>
  <p>Double-click inside the box to drop a red dot.</p>
  <script src="q7.js"></script>
</body>
</html>
