<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Q5 - Image Gallery</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 720px; margin: 30px auto; padding: 0 16px; }
    #gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    #gallery img { width: 100%; height: 140px; object-fit: cover; border-radius: 6px; cursor: pointer; }
    #gallery img:hover { opacity: 0.8; }
    #modal { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75);
             justify-content: center; align-items: center; }
    #modal.open { display: flex; }
    .modal-content { background: #fff; padding: 10px; border-radius: 8px; max-width: 90%; }
    .modal-content img { display: block; max-width: 100%; max-height: 80vh; }
  </style>
</head>
<body>
  <h2>Image Gallery</h2>
  <div id="gallery">
    <img src="https://picsum.photos/id/10/200/140" data-full="https://picsum.photos/id/10/900/600" alt="Image 1">
    <img src="https://picsum.photos/id/20/200/140" data-full="https://picsum.photos/id/20/900/600" alt="Image 2">
    <img src="https://picsum.photos/id/30/200/140" data-full="https://picsum.photos/id/30/900/600" alt="Image 3">
    <img src="https://picsum.photos/id/40/200/140" data-full="https://picsum.photos/id/40/900/600" alt="Image 4">
    <img src="https://picsum.photos/id/50/200/140" data-full="https://picsum.photos/id/50/900/600" alt="Image 5">
    <img src="https://picsum.photos/id/60/200/140" data-full="https://picsum.photos/id/60/900/600" alt="Image 6">
  </div>

  <div id="modal">
    <div class="modal-content">
      <img id="modalImg" src="" alt="Preview">
    </div>
  </div>
  <script src="q5.js"></script>
</body>
</html>
