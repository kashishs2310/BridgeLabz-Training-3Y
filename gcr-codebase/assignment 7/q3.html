<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Q3 - Multi-Step Form</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 420px; margin: 40px auto; padding: 0 16px; }
    .card { border: 1px solid #ccc; border-radius: 8px; padding: 20px; }
    .step { display: none; }
    .step.active { display: block; }
    label { display: block; margin-bottom: 6px; font-weight: bold; }
    input { width: 100%; padding: 8px; box-sizing: border-box; }
    .error { color: red; font-size: 13px; min-height: 18px; margin-top: 4px; }
    .buttons { display: flex; justify-content: space-between; margin-top: 12px; }
    button { padding: 8px 16px; cursor: pointer; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    #summary { display: none; }
    #progress { color: #666; margin-bottom: 12px; }
  </style>
</head>
<body>
  <h2>Multi-Step Form</h2>
  <div class="card">
    <div id="progress"></div>

    <div id="formArea">
      <div class="step active">
        <label for="name">Step 1: Name</label>
        <input type="text" id="name" placeholder="Your name">
        <div class="error"></div>
      </div>
      <div class="step">
        <label for="email">Step 2: Email</label>
        <input type="text" id="email" placeholder="you@example.com">
        <div class="error"></div>
      </div>
      <div class="step">
        <label for="password">Step 3: Password</label>
        <input type="password" id="password" placeholder="Min 6 characters">
        <div class="error"></div>
      </div>
      <div class="buttons">
        <button id="backBtn">Back</button>
        <button id="nextBtn">Next</button>
      </div>
    </div>

    <div id="summary">
      <h3>Summary</h3>
      <p><strong>Name:</strong> <span id="sumName"></span></p>
      <p><strong>Email:</strong> <span id="sumEmail"></span></p>
      <p><strong>Password:</strong> <span id="sumPassword"></span></p>
      <button id="restartBtn">Start Over</button>
    </div>
  </div>
  <script src="q3.js"></script>
</body>
</html>
