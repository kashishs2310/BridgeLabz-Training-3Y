<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Q1 - Product List Manager</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 520px; margin: 40px auto; padding: 0 16px; }
    .add-row { display: flex; gap: 8px; }
    .add-row input { flex: 1; padding: 8px; }
    button { padding: 8px 12px; cursor: pointer; }
    ul { list-style: none; padding: 0; margin-top: 20px; }
    li { display: flex; align-items: center; gap: 8px; padding: 8px; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 8px; }
    li .name { flex: 1; }
    li.editing { background: #fff8dc; }
    .edit-input { flex: 1; padding: 4px; }
    .delete-btn { background: #e74c3c; color: #fff; border: none; border-radius: 4px; }
    .edit-btn { background: #3498db; color: #fff; border: none; border-radius: 4px; }
  </style>
</head>
<body>
  <h2>Product List Manager</h2>
  <div class="add-row">
    <input type="text" id="productInput" placeholder="Enter product name">
    <button id="addBtn">Add</button>
  </div>
  <ul id="productList"></ul>
  <script src="q1.js"></script>
</body>
</html>
