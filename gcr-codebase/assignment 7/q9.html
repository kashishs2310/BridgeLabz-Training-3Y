<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Q9 - Form Submit Blocker</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 420px; margin: 40px auto; padding: 0 16px; }
    .field { margin-bottom: 14px; }
    label { display: block; font-weight: bold; margin-bottom: 4px; }
    input { width: 100%; padding: 8px; box-sizing: border-box; }
    input.invalid { border: 1px solid red; }
    .error { color: red; font-size: 13px; min-height: 16px; margin-top: 3px; }
    button { padding: 10px 18px; cursor: pointer; }
    #successMsg { display: none; color: green; font-weight: bold; margin-top: 14px; }
  </style>
</head>
<body>
  <h2>Registration Form</h2>
  <form id="myForm" novalidate>
    <div class="field">
      <label for="name">Name</label>
      <input type="text" id="name" placeholder="Your name">
      <div class="error" id="nameError"></div>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input type="text" id="email" placeholder="you@example.com">
      <div class="error" id="emailError"></div>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Min 6 characters">
      <div class="error" id="passwordError"></div>
    </div>
    <button type="submit">Submit</button>
  </form>
  <p id="successMsg">Form Submitted Successfully</p>
  <script src="q9.js"></script>
</body>
</html>
