<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Q2 - Character Counter</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
    textarea { width: 100%; height: 120px; padding: 8px; box-sizing: border-box; }
    #counter { font-weight: bold; margin: 8px 0; color: green; }
    #counter.warning { color: #d4a000; }
    #counter.danger { color: red; }
    button { padding: 8px 14px; cursor: pointer; }
  </style>
</head>
<body>
  <h2>Live Character Counter</h2>
  <textarea id="textBox" placeholder="Type here (max 100 characters)"></textarea>
  <div id="counter">100 characters remaining</div>
  <button id="resetBtn">Reset</button>
  <script src="q2.js"></script>
</body>
</html>
