<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Combined Effects</title>
<link rel="stylesheet" href="q9.css">
</head>
<body>

  <header>
    <h1>Combined Effects Demonstration</h1>
    <p>Hover over each button — every one combines a transform, a color change, and a shadow.</p>
  </header>

  <main class="effect-row">
    <button class="fx-btn grow-btn">Grow</button>
    <button class="fx-btn lift-btn">Lift</button>
    <button class="fx-btn tilt-btn">Tilt</button>
    <button class="fx-btn glow-btn">Glow</button>
  </main>

</body>
</html>
