<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini UI Layout</title>
<link rel="stylesheet" href="q10.css">
</head>
<body>

  <header class="site-header">
    <h1>Profile Settings</h1>
  </header>

  <main class="page-main">
    <section class="ui-card">
      <div class="avatar"></div>

      <form class="profile-form">
        <div class="field">
          <label for="full-name">Full Name</label>
          <input type="text" id="full-name" placeholder="Kashish Singh">
        </div>

        <div class="field">
          <label for="bio">Short Bio</label>
          <textarea id="bio" rows="3" placeholder="Tell us about yourself..."></textarea>
        </div>

        <div class="button-group">
          <button type="submit" class="btn btn-primary">Save Changes</button>
          <button type="button" class="btn btn-outline">Cancel</button>
        </div>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Kashish Singh</p>
  </footer>

</body>
</html>
