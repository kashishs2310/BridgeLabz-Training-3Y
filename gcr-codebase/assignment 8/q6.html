<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animation Demonstration</title>
<link rel="stylesheet" href="q6.css">
</head>
<body>

  <header>
    <h1>CSS Animation Demonstration</h1>
  </header>

  <main class="animation-stage">
    <div class="anim-item">
      <div class="moving-box"></div>
      <p class="label">Moving box (alternate direction)</p>
    </div>
    <div class="anim-item">
      <div class="bouncing-ball"></div>
      <p class="label">Bouncing ball (infinite)</p>
    </div>
    <div class="anim-item">
      <p class="color-text">Color-changing text</p>
      <p class="label">Text color cycle (delayed start)</p>
    </div>
  </main>

</body>
</html>
