<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Showcase</title>
<link rel="stylesheet" href="q3.css">
</head>
<body>

  <header>
    <h1>Image Showcase</h1>
  </header>

  <main class="showcase-grid">
    <figure class="showcase-item">
      <div class="img-wrap"><div class="img mountains"></div></div>
      <figcaption>Mountain Range</figcaption>
    </figure>
    <figure class="showcase-item">
      <div class="img-wrap"><div class="img forest"></div></div>
      <figcaption>Deep Forest</figcaption>
    </figure>
    <figure class="showcase-item">
      <div class="img-wrap"><div class="img coast"></div></div>
      <figcaption>Rocky Coast</figcaption>
    </figure>
    <figure class="showcase-item">
      <div class="img-wrap"><div class="img desert"></div></div>
      <figcaption>Desert Dunes</figcaption>
    </figure>
    <figure class="showcase-item">
      <div class="img-wrap"><div class="img lake"></div></div>
      <figcaption>Alpine Lake</figcaption>
    </figure>
    <figure class="showcase-item">
      <div class="img-wrap"><div class="img city"></div></div>
      <figcaption>City Lights</figcaption>
    </figure>
  </main>

</body>
</html>
