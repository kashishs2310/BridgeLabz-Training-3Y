<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tooltip Demo</title>
<link rel="stylesheet" href="q2.css">
</head>
<body>

  <header>
    <h1>CSS-Only Tooltips</h1>
    <p>Hover over any item below to see its tooltip.</p>
  </header>

  <main class="tooltip-stage">
    <span class="tooltip-trigger" data-tooltip="This means Cascading Style Sheets">CSS</span>
    <span class="tooltip-trigger" data-tooltip="Hypertext Markup Language">HTML</span>
    <span class="tooltip-trigger" data-tooltip="A layout module for one-dimensional alignment">Flexbox</span>
    <span class="tooltip-trigger" data-tooltip="A layout module for two-dimensional alignment">Grid</span>
  </main>

</body>
</html>
