<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pseudo-Classes Demo</title>
<link rel="stylesheet" href="q1.css">
</head>
<body>

  <header>
    <h1>Pseudo-Classes in Action</h1>
  </header>

  <main class="example-row">
    <section class="example">
      <a href="#" class="hover-link">Hover me</a>
      <p>:hover — changes color on mouse-over.</p>
    </section>

    <section class="example">
      <button class="focus-btn">Tab to me</button>
      <p>:focus — highlights when selected via keyboard or click.</p>
    </section>

    <section class="example">
      <button class="active-btn">Click and hold</button>
      <p>:active — changes appearance while being pressed.</p>
    </section>

    <section class="example">
      <ul class="nth-list">
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
        <li>Item 4</li>
      </ul>
      <p>:nth-child(even) — shades alternating list items.</p>
    </section>
  </main>

</body>
</html>
