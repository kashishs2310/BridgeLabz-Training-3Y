<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q1 - Responsive Image Filter Gallery</title>
  <link rel="stylesheet" href="q1.css">
</head>
<body>
  <header>
    <h1>Responsive Image Filter Gallery</h1>
  </header>

  <main>
    <!-- Grid gallery with 6 images, each with a different filter -->
    <section class="gallery">
      <figure class="gallery-item blur">
        <img src="https://picsum.photos/id/1015/400/300" alt="Mountain river landscape">
        <figcaption>Blur Filter</figcaption>
      </figure>

      <figure class="gallery-item grayscale">
        <img src="https://picsum.photos/id/1016/400/300" alt="Canyon landscape">
        <figcaption>Grayscale Filter</figcaption>
      </figure>

      <figure class="gallery-item sepia">
        <img src="https://picsum.photos/id/1018/400/300" alt="Mountains and lake">
        <figcaption>Sepia Filter</figcaption>
      </figure>

      <figure class="gallery-item brightness">
        <img src="https://picsum.photos/id/1021/400/300" alt="Forest path">
        <figcaption>Brightness Filter</figcaption>
      </figure>

      <figure class="gallery-item contrast">
        <img src="https://picsum.photos/id/1024/400/300" alt="Desert dunes">
        <figcaption>Contrast Filter</figcaption>
      </figure>

      <figure class="gallery-item hue-rotate">
        <img src="https://picsum.photos/id/1035/400/300" alt="Forest trees">
        <figcaption>Hue-Rotate Filter</figcaption>
      </figure>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Responsive CSS Assignment</p>
  </footer>
</body>
</html>
