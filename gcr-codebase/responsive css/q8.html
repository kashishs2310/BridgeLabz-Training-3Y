<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q8 - Filter Comparison Layout</title>
  <link rel="stylesheet" href="q8.css">
</head>
<body>
  <header>
    <h1>Before &amp; After Filter Comparison</h1>
  </header>

  <main>
    <section class="compare-row">
      <figure class="compare-item">
        <img src="https://picsum.photos/id/1041/400/300" alt="Original unedited photo">
        <figcaption>Before (Original)</figcaption>
      </figure>

      <figure class="compare-item after">
        <img src="https://picsum.photos/id/1041/400/300" alt="Photo with brightness and contrast filter applied">
        <figcaption>After (Filtered)</figcaption>
      </figure>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Responsive CSS Assignment</p>
  </footer>
</body>
</html>
