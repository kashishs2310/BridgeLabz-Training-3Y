<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q3 - Responsive Cards with Media Queries</title>
  <link rel="stylesheet" href="q3.css">
</head>
<body>
  <header>
    <h1>Responsive Cards</h1>
  </header>

  <main>
    <section class="card-row">
      <article class="card">
        <h2>Card One</h2>
        <p>Desktop shows four columns, tablet two, mobile one.</p>
      </article>
      <article class="card">
        <h2>Card Two</h2>
        <p>Hover changes the background color of each card.</p>
      </article>
      <article class="card">
        <h2>Card Three</h2>
        <p>Equal spacing and padding are maintained throughout.</p>
      </article>
      <article class="card">
        <h2>Card Four</h2>
        <p>Layout is built entirely using Flexbox.</p>
      </article>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Responsive CSS Assignment</p>
  </footer>
</body>
</html>
