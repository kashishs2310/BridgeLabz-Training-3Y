<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q16 - URI Encoding</title>
</head>
<body>

    <h1>URI Encoding Demonstration</h1>

    <p>Original (unencoded) URL: https://example.com/search?query=HTML & CSS</p>

    <p>
        Encoded link:
        <a href="https://example.com/search?query=HTML%20&%20CSS">
            https://example.com/search?query=HTML%20&%20CSS
        </a>
    </p>

</body>
</html>
