<body>

    <h1>Login Form</h1>

    <form action="#" method="post">

        <label for="username">Username:</label>

        <label for="password">Password:</label>

        <input type="hidden" name="csrf_token" value="dummyCSRFToken12345">

        <input type="submit" value="Login">

    </form>

</body>
