<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q9 - File Upload Form</title>
</head>
<body>

    <h1>File Upload Form</h1>

    <form action="#" method="post" enctype="multipart/form-data">

        <label for="fileupload">Choose a file:</label>
        <input type="file" id="fileupload" name="fileupload" accept=".jpg,.png" required>
        <br><br>

        <input type="submit" value="Upload">

    </form>

    <p>Only image files with the .jpg or .png extension are allowed to be uploaded.</p>

</body>
</html>
