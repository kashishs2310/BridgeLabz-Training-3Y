<!DOCTYPE html>
<!-- Question 9: Paragraph using both <strong> and <em> to emphasize different parts -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Strong and Em Example</title>
</head>
<body>

    <p>
        Cybersecurity is a <strong>critical</strong> field in today's digital
        world, and it is <em>constantly evolving</em> as new threats emerge.
    </p>

</body>
</html>
