<!DOCTYPE html>
<!-- Question 8: Paragraph using <mark> for highlighting and <small> for a small note -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mark and Small Example</title>
</head>
<body>

    <p>
        I am currently learning about <mark>network security</mark> and how to
        protect systems from common vulnerabilities.
        <small>Updated recently</small>
    </p>

</body>
</html>
