<!DOCTYPE html>
<!-- Question 6: Blockquote with a meaningful quote and the author's name using <cite> -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blockquote Example</title>
</head>
<body>

    <blockquote>
        The quieter you become, the more you are able to hear.
    </blockquote>
    <p>&mdash; <cite>Ram Dass</cite></p>

</body>
</html>
