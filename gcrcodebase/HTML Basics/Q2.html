<!DOCTYPE html>
<!-- Question 2: Hyperlink to Google that opens in a new tab -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hyperlink Example</title>
</head>
<body>

    <!-- target="_blank" opens the link in a new tab -->
    <!-- rel="noopener noreferrer" is a security best practice for new-tab links -->
    <p>
        You can search the web using
        <a href="https://www.google.com" target="_blank" rel="noopener noreferrer">Google Search</a>.
    </p>

</body>
</html>
