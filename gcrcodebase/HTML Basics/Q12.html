<!DOCTYPE html>
<!-- Question 12: Creative paragraph combining multiple inline elements -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Combined Inline Elements Example</title>
</head>
<body>

    <p>
        <strong>Cybersecurity</strong> is more than just a subject to me &mdash;
        it is a <em>passion</em>.<br>
        I enjoy <mark>solving CTF challenges</mark> in my free time.
        <small>Updated recently</small>
    </p>

</body>
</html>
