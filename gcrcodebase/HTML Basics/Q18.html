<!DOCTYPE html>
<!-- Question 17: An article with a heading and a blog-style paragraph, inside main -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Article Example</title>
</head>
<body>

    <main>
        <article>
            <h2>My First Blog</h2>
            <p>
                Starting my journey in cybersecurity has been exciting. From
                learning the basics of networking to exploring how attackers
                exploit vulnerabilities, every day brings something new to learn.
            </p>
        </article>
    </main>

</body>
</html>
