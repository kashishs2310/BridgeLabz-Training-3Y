<!DOCTYPE html>
<!-- Question 11: Paragraph containing three <span> elements to label parts of the text -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Span Example</title>
</head>
<body>

    <p>
        My daily routine includes
        <span title="Morning activity">attending college lectures</span>,
        <span title="Afternoon activity">practicing coding problems</span>, and
        <span title="Evening activity">exploring cybersecurity labs</span>.
    </p>

</body>
</html>
