<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Course Registration Form</title>
</head>
<body>

    <header>
        <h1>Course Registration</h1>
    </header>

    <main>
        <form action="#" method="post">

            <!-- Fieldset for personal details -->
            <fieldset>
                <legend>Personal Details</legend>

                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name"><br><br>

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" placeholder="Enter your email"><br><br>
            </fieldset>

            <br>

            <!-- Fieldset for course selection -->
            <fieldset>
                <legend>Course Selection</legend>

                <label for="course">Select Course:</label>
                <select id="course" name="course">
                    <option value="cyber">Cybersecurity Fundamentals</option>
                    <option value="web">Web Development</option>
                    <option value="dsa">Data Structures and Algorithms</option>
                    <option value="ai">Artificial Intelligence Basics</option>
                </select><br><br>
            </fieldset>

            <br>

            <input type="submit" value="Register">

        </form>

        <!-- Table showing available course schedules -->
        <h2>Available Course Schedules</h2>
        <table border="1" cellpadding="6">
            <tr>
                <th>Day</th>
                <th>Time</th>
                <th>Instructor</th>
            </tr>
            <tr>
                <td>Monday</td>
                <td>10:00 AM - 11:30 AM</td>
                <td>Dr. R. Sharma</td>
            </tr>
            <tr>
                <td>Wednesday</td>
                <td>2:00 PM - 3:30 PM</td>
                <td>Prof. A. Verma</td>
            </tr>
            <tr>
                <td>Friday</td>
                <td>11:00 AM - 12:30 PM</td>
                <td>Dr. S. Gupta</td>
            </tr>
        </table>
    </main>

    

</body>
</html>
